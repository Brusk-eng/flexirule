name: Deploy Landing Page and Docs

on:
  push:
    branches:
      - develop
      - 'feature/**'
    paths:
      - 'landing-page/**'
      - 'docs/**'
      - 'docs-config/**'
      - '.github/workflows/deploy-landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Doks documentation on the fly
        run: |
          # 1. Initialize a temporary Doks project
          npx create-hyas@latest temp-docs --template doks --yes
          cd temp-docs

          # 2. Install dependencies
          npm install

          # 3. Apply custom configurations
          cp ../docs-config/hugo.toml config/_default/hugo.toml
          cp ../docs-config/menus.en.toml config/_default/menus/menus.en.toml

          # 4. Fix the known getjson vs getremote issue in default config if still present
          sed -i 's/\[caches\.getjson\]/\[caches\.getremote\]/g' config/_default/hugo.toml

          # 5. Copy content
          rm -rf content/docs/*
          cp -r ../docs/* content/docs/

          # 6. Build
          npm run build

          # 7. Move output to landing page
          cd ..
          mkdir -p landing-page/docs
          cp -r temp-docs/public/* landing-page/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './landing-page'

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
