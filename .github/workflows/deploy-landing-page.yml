name: Deploy Landing Page and Docs

on:
  push:
    branches:
      - develop
      - 'feature/**'
    paths:
      - 'landing-page/**'
      - 'docs/**'
      - 'docs-config/**'
      - '.github/workflows/deploy-landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Doks documentation on the fly
        run: |
          # 1. Scaffold a temporary Doks project non-interactively
          mkdir temp-docs
          cd temp-docs
          # Pin to a specific stable-ish state
          git clone --depth 1 https://github.com/gethyas/doks .
          rm -rf .git

          # 2. Install dependencies
          npm install

          # 3. Apply custom configurations
          # Using case-insensitive sed to match baseURL or baseurl
          sed -i 's|base[uU][rR][lL] = ".*"|baseurl = "https://sendipad.github.io/flexirule/docs/"|' config/_default/hugo.toml
          sed -i 's|title = ".*"|title = "FlexiRule Documentation"|' config/_default/hugo.toml

          # Use our custom menu
          cp ../docs-config/menus.en.toml config/_default/menus/menus.en.toml

          # 4. Copy content
          rm -rf content/docs/*
          cp -r ../docs/* content/docs/

          # 5. Build
          npm run build

          # 6. Move output to landing page
          cd ..
          mkdir -p landing-page/docs
          # Copy the entire public folder so assets (CSS/JS) are included.
          cp -r temp-docs/public/* landing-page/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './landing-page'

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
