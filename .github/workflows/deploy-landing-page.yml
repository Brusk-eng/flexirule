name: Deploy Landing Page and Docs

on:
  push:
    branches:
      - develop
      - 'feature/**'
    paths:
      - 'landing-page/**'
      - 'docs-hugo/**'
      - '.github/workflows/deploy-landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-hugo/package-lock.json

      - name: Install dependencies
        working-directory: docs-hugo
        run: npm install

      - name: Build documentation
        working-directory: docs-hugo
        run: npm run build

      - name: Move built docs to landing page
        run: |
          mkdir -p landing-page/docs
          cp -r docs-hugo/public/* landing-page/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './landing-page'

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
