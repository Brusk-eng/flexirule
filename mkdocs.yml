site_name: FlexiRule Documentation
site_description: Visual Rule Engineer & Orchestration Engine Documentation
repo_url: https://github.com/Sendipad/flexirule
edit_uri: edit/develop/docs/

theme:
  name: material
  palette:
    # Palette for dark mode (matching the Claude aesthetic)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    logo: material/robot-industrial

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - System Overview (AR): system_overview_ar.md
  - Controls: CONTROLS.md
  - Builder:
    - Rule Builder: builder/rule_builder.md
    - Condition Builder: builder/condition_builder.md
    - User Guide (Conditions): builder/user_guide_conditions.md
    - Frontend Technical: builder/frontend_technical.md
  - Actions:
    - Overview: actions/overview.md
    - Assignment: actions/assignment.md
    - Condition: actions/condition.md
    - Document Action: actions/document_action.md
    - Loop: actions/loop.md
    - Notify: actions/notify.md
    - Process: actions/process.md
    - Query Records: actions/query_records.md
    - Switch: actions/switch.md
    - Standards: actions/standards.md
  - Engine:
    - Execution Engine: engine/execution_engine.md
    - Condition System: engine/condition_system.md
    - Trigger System: engine/trigger_system.md
    - Orchestration: engine/orchestration.md
  - Reference:
    - API: reference/api.md
    - Internals: reference/internals.md
    - Doctypes: reference/doctypes.md
    - Contracts: reference/contracts.md
  - Roadmap:
    - Technical Audit: roadmap/technical_audit.md
